[project]
name = "product-similarity"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.16.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.5",
    "open-clip-torch>=4.2.2",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "rembg[cpu]>=2.0.87",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
